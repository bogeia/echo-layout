name: Go

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make generate && git diff --exit-code
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
